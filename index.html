<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 療癒時光小天地 - 可愛即時時鐘 & 萌寵花園 🌸</title>
  <meta name="description" content="一個簡潔、超可愛的互動時鐘網站，擁有動態夢幻背景、漫步的小動物群與趣味互動按鈕！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="theme-day">
  <!-- 動態夢幻背景層 -->
  <div class="sky-background" id="skyBackground">
    <!-- 天體：太陽 / 晚霞 / 月亮 -->
    <div class="celestial-body" id="celestialBody">
      <div class="sun-moon-core"></div>
      <div class="celestial-glow"></div>
      <div class="moon-crater c1"></div>
      <div class="moon-crater c2"></div>
    </div>

    <!-- 飄移的棉花糖雲朵群 -->
    <div class="cloud-layer" id="cloudLayer">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <!-- 漂浮星光與氣泡容器 -->
    <div class="sparkles-container" id="sparklesContainer"></div>
  </div>

  <!-- 主要內容容器 -->
  <main class="main-wrapper">
    <!-- 頂部中央：超可愛玻璃擬態時鐘與個人名牌卡片 -->
    <div class="kawaii-card glass-card" id="mainCard">
      <!-- 裝飾小耳 -->
      <div class="card-bunny-ears">
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
      </div>

      <!-- 名字標籤 (固定顯示：江晏瑋) -->
      <div class="user-badge-container">
        <div class="user-badge" id="nameDisplayBadge">
          <span class="badge-sparkle">✨</span>
          <span class="badge-name" id="userNameText">江晏瑋</span>
          <span class="badge-tag">的元氣小天地</span>
        </div>
      </div>

      <!-- 實時數字時鐘 (大字體 + 跳動愛心) -->
      <div class="clock-display" id="clockDisplay">
        <div class="time-segments">
          <span class="digit hours" id="hours">12</span>
          <span class="separator-heart" id="colon">♥</span>
          <span class="digit minutes" id="minutes">00</span>
          <span class="separator-seconds">:</span>
          <span class="digit seconds" id="seconds">00</span>
        </div>
        <div class="ampm-tag" id="ampm">AM</div>
      </div>

      <!-- 日期與星期 (可點擊開啟記事手帳本) -->
      <div class="date-display" id="dateDisplayBtn" role="button" tabindex="0" title="點擊開啟可愛記事本">
        <span class="calendar-icon">📅</span>
        <span id="fullDateText">2026 年 09 月 16 日</span>
        <span class="date-divider">•</span>
        <span id="dayOfWeekText" class="day-highlight">星期三</span>
        <span class="notepad-hint-tag">📖 點開記事本</span>
      </div>

      <!-- 元氣心情小籤語 -->
      <div class="greeting-banner" id="greetingBanner">
        <span class="greeting-emoji">🌸</span>
        <span class="greeting-text" id="greetingText">正在讀取今日好心情...</span>
      </div>

      <!-- 今日代辦小清單 (主頁即時顯示) -->
      <div class="home-todo-section" id="homeTodoSection">
        <div class="home-todo-header">
          <div class="home-todo-title-wrap" id="homeTodoTitleClick" role="button" tabindex="0" title="點擊開啟手帳待辦本">
            <span class="home-todo-icon">📋</span>
            <span class="home-todo-title">今日待辦</span>
            <span class="home-todo-badge" id="homeTodoBadge">0/0 完成</span>
          </div>
          <div class="home-todo-actions">
            <button class="home-todo-quick-btn" id="homeTodoAddToggleBtn" title="聚焦新增輸入框">
              <span>➕ 新增待辦</span>
            </button>
            <button class="home-todo-notebook-btn" id="homeOpenNotebookBtn" title="開啟手帳待辦本">
              <span>📖 手帳</span>
            </button>
          </div>
        </div>

        <!-- 快速新增輸入欄 -->
        <div class="home-todo-input-bar" id="homeTodoInputBar">
          <input type="text" id="homeTodoInput" placeholder="寫下今天要完成的小事... (按 Enter 新增)" maxlength="40" autocomplete="off">
          <button id="homeTodoSubmitBtn" class="home-todo-submit-btn">新增</button>
        </div>

        <!-- 今日待辦項目清單 (主頁即時渲染) -->
        <div class="home-todo-list-container">
          <ul class="home-todo-list" id="homeTodoList">
            <!-- 動態生成代辦項目 -->
          </ul>
          <!-- 無代辦時的可愛空狀態 -->
          <div class="home-todo-empty" id="homeTodoEmpty">
            <span class="empty-icon">🌸</span>
            <span class="empty-text">今天還沒有待辦事項喔～點擊「➕ 新增」記錄一下吧！</span>
          </div>
        </div>
      </div>

      <!-- 小提示 -->
      <div class="card-tips">
        <span>💡 點擊下方按鈕餵食或摸摸小動物，看看牠們的可愛反應吧！</span>
      </div>
    </div>
  </main>

  <!-- 底部小動物漫步樂園與地景草坡 -->
  <section class="critter-playground" id="playground" aria-label="小動物走走草地">
    <!-- 遠景草坡 -->
    <div class="rolling-hills hill-back"></div>
    <!-- 近景草坡 -->
    <div class="rolling-hills hill-front">
      <!-- 搖曳小花與草叢 -->
      <div class="flora flora-1">🌸</div>
      <div class="flora flora-2">🌼</div>
      <div class="flora flora-3">🌷</div>
      <div class="flora flora-4">🌱</div>
      <div class="flora flora-5">🌸</div>
      <div class="flora flora-6">🌼</div>
    </div>

    <!-- 小動物活動層 -->
    <div class="animals-track" id="animalsTrack">
      <!-- 小動物會由 JS 動態生成並在此處自由漫步 -->
    </div>

    <!-- 食物掉落層 -->
    <div class="treats-layer" id="treatsLayer"></div>
  </section>

  <!-- 浮動超可愛按鈕操作欄 (Dock) -->
  <nav class="kawaii-dock" aria-label="可愛互動操作欄">
    <button class="dock-btn btn-feed" id="btnFeed" title="丟出美味點心餵食小動物">
      <span class="btn-icon">🍪</span>
      <span class="btn-label">餵食點心</span>
    </button>
    <button class="dock-btn btn-petals" id="btnPetals" title="滿螢幕飄落愛心與花瓣">
      <span class="btn-icon">🌸</span>
      <span class="btn-label">撒花愛心</span>
    </button>
    <button class="dock-btn btn-summon" id="btnSummon" title="召喚一隻新的可愛小夥伴">
      <span class="btn-icon">🐾</span>
      <span class="btn-label">召喚萌寵</span>
    </button>
    <button class="dock-btn btn-theme" id="btnTheme" title="切換白天、黃昏或星夜">
      <span class="btn-icon" id="themeIcon">☀️</span>
      <span class="btn-label" id="themeLabel">日光白晝</span>
    </button>
    <button class="dock-btn btn-sound" id="btnSound" title="開關可愛音效">
      <span class="btn-icon" id="soundIcon">🔔</span>
      <span class="btn-label" id="soundLabel">音效開</span>
    </button>
  </nav>



  <!-- 可愛手帳記事本彈窗 (Kawaii Notepad Modal) -->
  <div class="kawaii-modal-overlay" id="notepadModal">
    <div class="kawaii-notebook-card">
      <!-- 活頁孔裝飾 (Binder Rings) -->
      <div class="binder-rings-strip">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>

      <!-- 手帳標題欄 -->
      <div class="notebook-header">
        <div class="notebook-title-area">
          <span class="notebook-sticker">📔</span>
          <div class="notebook-title-info">
            <h3 id="notepadDateTitle">2026 年 09 月 16 日 元氣手帳</h3>
            <span class="notebook-subtitle">隨時記下今日美好時光與待辦事項 ✨</span>
          </div>
        </div>
        <button class="notebook-close-btn" id="closeNotepadBtn" aria-label="關閉手帳" title="關閉手帳">✖</button>
      </div>

      <!-- 今日心情選擇標籤 (Mood Tags) -->
      <div class="mood-selector-wrap">
        <span class="mood-label">今日心情：</span>
        <div class="mood-chips" id="moodChips">
          <button class="mood-chip active" data-mood="🥰 開心">🥰 開心</button>
          <button class="mood-chip" data-mood="🌸 悠閒">🌸 悠閒</button>
          <button class="mood-chip" data-mood="🍰 甜蜜">🍰 甜蜜</button>
          <button class="mood-chip" data-mood="⚡ 活力">⚡ 活力</button>
          <button class="mood-chip" data-mood="💤 睏睏">💤 睏睏</button>
        </div>
      </div>

      <!-- 手帳頁面分頁 Tab -->
      <div class="notebook-tabs">
        <button class="nb-tab active" id="tabDiaryBtn">📝 心情隨手記</button>
        <button class="nb-tab" id="tabTodoBtn">📋 今日小願望待辦 (<span id="todoCount">0</span>)</button>
      </div>

      <!-- 內容區 1：心情隨手記 (Diary / Notes) -->
      <div class="notebook-body tab-content active" id="diaryTabContent">
        <textarea id="notepadTextarea" placeholder="親愛的小主人，今天發生了什麼有趣或開心的事呢？在這裡寫下來吧～ (´,,•ω•,,)♡"></textarea>
      </div>

      <!-- 內容區 2：今日小願望待辦 (To-Dos) -->
      <div class="notebook-body tab-content" id="todoTabContent">
        <div class="todo-input-bar">
          <input type="text" id="newTodoInput" placeholder="寫下今天要完成的小事... (例如：喝8杯水、摸摸小貓)" maxlength="40">
          <button id="addTodoBtn" class="todo-add-btn">➕ 新增</button>
        </div>
        <ul class="todo-list" id="todoList">
          <!-- 動態生成 To-Do 項目 -->
        </ul>
      </div>

      <!-- 底部功能列 -->
      <div class="notebook-footer">
        <div class="save-status" id="saveStatus">💾 已自動保存</div>
        <div class="notebook-footer-actions">
          <button class="nb-btn btn-clear-note" id="clearNoteBtn">清空內容</button>
          <button class="nb-btn btn-save-note" id="saveNoteBtn">完成儲存 💖</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 粒子特效畫布 (撒花、愛心、煙火) -->
  <canvas id="particleCanvas"></canvas>

  <script src="script.js?v=2"></script>
</body>
</html>
